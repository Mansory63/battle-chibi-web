  var FIRE_EVERY = 0.16; // Sekunden zwischen Schüssen
  var FLY = 0.35;      // Flugzeit einer Kugel

    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.floor(W * dpr); cv.height = Math.floor(H * dpr);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';

    s = Math.max(0.7, Math.min(1.6, Math.min(W, H) / 480));
  }

  function started(){ try { return !!window.__bc_started; } catch(e){ return false; } }

  function shooterX(){ return W * 0.16; }
  function skelX(){ return W * 0.80; }
  function groundY(){ return H * 0.55; }

  function drawShooter(){
    var x = shooterX(), y = groundY(), k = s;
    ctx.save();
    ctx.translate(x, y);
    // Beine
    ctx.fillStyle = '#2d3f7a';
    ctx.fillRect(-9*k, -2*k, 7*k, 22*k); ctx.fillRect(2*k, -2*k, 7*k, 22*k);
    // Körper

    // Kopf
    ctx.fillStyle = '#ffd7b0';
    ctx.beginPath(); ctx.arc(0, -56*k, 15*k, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#1b2a5e';
    ctx.beginPath(); ctx.arc(-5*k, -57*k, 2.2*k, 0, Math.PI*2); ctx.arc(5*k, -57*k, 2.2*k, 0, Math.PI*2); ctx.fill();
    // Helm
    ctx.fillStyle = '#4d6ad8';

    // Gewehr

    ctx.fillRect(10*k, -34*k, 34*k, 7*k);
    ctx.restore();

  function drawSkeleton(){
    var x = skelX(), y = groundY(), k = s;
    var age = t - flashT;
    var shake = age < 0.05 ? Math.sin(age * 90) * 4 * k : 0;
    var flash = age < 0.05;

  function roundRect(x, y, w, h, r){

    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);

    ctx.moveTo(x - 8*k, y - 3*k); ctx.lineTo(x + 4*k, y - 3*k);

  function frame(now){
    if (done) return;
    if (!t0ms) t0ms = now;
    t = (now - t0ms) / 1000; // echte Zeit, auch wenn der Browser ruckelt

    ov.id = 'bcL';
    ov.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;z-index:100000;background:#0f1733;transition:none';

    window.addEventListener('resize', size);
    requestAnimationFrame(frame);
  }

	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}

		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
