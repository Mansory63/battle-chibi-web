html/head_include="<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover\"><meta name=\"apple-mobile-web-app-capable\" content=\"yes\"><meta name=\"mobile-web-app-capable\" content=\"yes\"><meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\"><meta name=\"apple-mobile-web-app-title\" content=\"BattleChibi\"><meta name=\"theme-color\" content=\"#14204a\"><style>html,body{background:#14204a !important;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}#status-progress{background-color:#ffd34d !important}@keyframes bcGrad{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}@keyframes bcBounce{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-22px) rotate(6deg)}}@keyframes bcPulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}@keyframes bcBar{0%{background-position:0 0}100%{background-position:40px 0}}#status{background:linear-gradient(120deg,#14204a,#2b1d5c,#0f4a5e,#14204a) !important;background-size:300% 300% !important;animation:bcGrad 8s ease infinite;position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;overflow:hidden}#status::before{content:'🐣 BattleChibi';display:block;position:absolute;left:0;right:0;top:22%;text-align:center;font:700 40px sans-serif;color:#ffd34d;text-shadow:0 4px 0 #2b1d5c;animation:bcPulse 1.6s ease-in-out infinite}#status::after{content:'🥊 🏹 💥 🧟 🐔 🚀';display:block;position:absolute;left:0;right:0;top:44%;text-align:center;font-size:34px;animation:bcBounce 1.2s ease-in-out infinite}#status-progress{background-image:repeating-linear-gradient(45deg,#ffd34d 0 12px,#ffb300 12px 24px) !important;background-size:40px 40px;animation:bcBar .6s linear infinite}#status-notice{color:#fff !important;font:600 18px sans-serif;text-shadow:0 2px 0 #000}</style><script>(function(){var n=0;function box(){if(document.getElementById('bc-fix'))return;var d=document.createElement('div');d.id='bc-fix';d.style.cssText='position:fixed;left:0;right:0;bottom:0;padding:16px;background:#14204a;color:#fff;font:18px sans-serif;text-align:center;z-index:99999';d.appendChild(document.createTextNode('Das Spiel hat ein Problem. '));var b=document.createElement('button');b.textContent='Reparieren und neu laden';b.style.cssText='font-size:18px;padding:8px 16px;margin-left:8px';b.onclick=fixit;d.appendChild(b);document.body.appendChild(d);}function fixit(){try{if(window.caches){caches.keys().then(function(k){k.forEach(function(x){caches.delete(x)})})}if(navigator.serviceWorker){navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(x){x.unregister()})})}}catch(e){}setTimeout(function(){location.reload()},400);}window.__bcfix=fixit;window.addEventListener('error',function(){n++;if(n>25)box();});setTimeout(function(){if(!window.__bc_started){try{if(!sessionStorage.getItem('bc_auto')){sessionStorage.setItem('bc_auto','1');fixit();return;}}catch(e){}box();}},60000);})();</script>"
