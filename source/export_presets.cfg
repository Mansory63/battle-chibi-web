html/head_include="<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover\"><meta name=\"apple-mobile-web-app-capable\" content=\"yes\"><meta name=\"mobile-web-app-capable\" content=\"yes\"><meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\"><meta name=\"apple-mobile-web-app-title\" content=\"BattleChibi\"><meta name=\"theme-color\" content=\"#14204a\"><style>html,body{background:#14204a !important;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}#status{background:linear-gradient(180deg,#0f1733,#1b2a5e) !important;position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;overflow:hidden}@keyframes bcIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes bcSlide{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}#status::before{content:'BattleChibi';display:block;position:absolute;left:0;right:0;top:38%;text-align:center;font:700 34px -apple-system,Segoe UI,Roboto,sans-serif;letter-spacing:2px;color:#ffffff;animation:bcIn .6s ease both}#status-progress{background:#2a3a75 !important;border-radius:4px;overflow:hidden;position:absolute !important;left:0 !important;right:0 !important;margin:0 auto !important;width:50% !important;top:52% !important;height:6px !important;appearance:none;-webkit-appearance:none;border:0 !important}#status-progress::-webkit-progress-bar{background:#2a3a75}#status-progress::-webkit-progress-value{background:#7ab8ff}#status-splash{display:none !important}#status-notice{position:absolute !important;left:0;right:0;top:58% !important;color:#9fb2e0 !important;font:500 14px -apple-system,Segoe UI,Roboto,sans-serif;text-align:center}</style><script>(function(){var n=0;function box(){if(document.getElementById('bc-fix'))return;var d=document.createElement('div');d.id='bc-fix';d.style.cssText='position:fixed;left:0;right:0;bottom:0;padding:16px;background:#14204a;color:#fff;font:18px sans-serif;text-align:center;z-index:99999';d.appendChild(document.createTextNode('Das Spiel hat ein Problem. '));var b=document.createElement('button');b.textContent='Reparieren und neu laden';b.style.cssText='font-size:18px;padding:8px 16px;margin-left:8px';b.onclick=fixit;d.appendChild(b);document.body.appendChild(d);}function fixit(){try{if(window.caches){caches.keys().then(function(k){k.forEach(function(x){caches.delete(x)})})}if(navigator.serviceWorker){navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(x){x.unregister()})})}}catch(e){}setTimeout(function(){location.reload()},400);}window.__bcfix=fixit;window.addEventListener('error',function(){n++;if(n>25)box();});setTimeout(function(){if(!window.__bc_started){try{if(!sessionStorage.getItem('bc_auto')){sessionStorage.setItem('bc_auto','1');fixit();return;}}catch(e){}box();}},60000);})();</script>"
